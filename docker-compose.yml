services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: "postgres://saas:saas@postgres:5432/saas"
      AUTH_SECRET: "replace-me-with-at-least-32-characters!!"
      APP_URL: "http://localhost:3000"
      RATE_LIMIT_BACKEND: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
